---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secret-stores
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  path: ./infra/external-secrets/secretstores
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system

