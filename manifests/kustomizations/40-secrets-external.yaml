---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-external
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  path: ./infra/secrets
  dependsOn:
    - name: external-secrets
    - name: secret-stores
  sourceRef:
    kind: GitRepository
    name: flux-system

