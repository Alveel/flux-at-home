---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  path: ./infra/cert-manager/issuers
  dependsOn:
    - name: secrets-external
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system

