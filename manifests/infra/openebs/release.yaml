---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 5m
  chart:
    spec:
      chart: openebs
      version: 4.3.3
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: helm-sources
  values:
    engines:
      replicated:
        mayastor:
          enabled: false
    alloy:
      enabled: false
    loki:
      enabled: false
    zfs-localpv:
      zfsNode:
        kubeletDir: /var/lib/rancher/k3s

