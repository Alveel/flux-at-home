---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  path: ./manifests/infra/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap-issuers
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  path: ./manifests/infra/cert-manager/bootstrap
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  path: ./manifests/infra/external-secrets
  dependsOn:
    - name: bootstrap-issuers
  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-external
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  path: ./manifests/infra/secrets
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  path: ./manifests/infra/cert-manager/issuers
  dependsOn:
    - name: secrets-external
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system

