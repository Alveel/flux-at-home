apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-zfspv
parameters:
  fstype: "zfs"
  poolname: "biggy/data/kubernetes"
  recordsize: "128k"
provisioner: zfs.csi.openebs.io
reclaimPolicy: Retain
allowedTopologies:
- matchLabelExpressions:
  - key: kubernetes.io/hostname
    values:
      - thrifty.kik.pw

